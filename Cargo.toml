[workspace]
members = [
    "crates/rpp",
    "crates/rpp-cli",
    "crates/rpp-fetch",
    "crates/rpp-squash",
    "crates/rpp-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2021"
rust-version = "1.96.0"
license = "MIT"
authors = ["oglass <him@oglass.dev>"]
repository = "https://github.com/chunkzero/rpp"
description = "Tools and libraries for processing Minecraft resource packs"

[workspace.dependencies]
rpp = { path = "crates/rpp" }
rpp-fetch = { path = "crates/rpp-fetch" }
rpp-squash = { path = "crates/rpp-squash" }
rpp-wasm = { path = "crates/rpp-wasm" }

anyhow = "1.0"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3.13"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
