[workspace]
members = [
  "crates/rpp",
  "crates/rpp-cli",
  "crates/rpp-fetch",
  "crates/rpp-js",
  "crates/rpp-squash",
  "crates/rpp-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2021"
rust-version = "1.96.0"
license = "MIT OR Apache-2.0"
authors = ["chunkzero"]
repository = "https://github.com/chunkzero/rpp"
description = "Tools and libraries for processing Minecraft resource packs"

[workspace.dependencies]
rpp = { path = "crates/rpp" }
rpp-fetch = { path = "crates/rpp-fetch" }
rpp-js = { path = "crates/rpp-js" }
rpp-squash = { path = "crates/rpp-squash" }
rpp-wasm = { path = "crates/rpp-wasm" }

anyhow = "1.0"
dirs = "5"
globset = "0.4"
oxipng = { version = "10", default-features = false, features = ["parallel"] }
png = "0.17"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1.0", features = ["serde"] }
sha2 = "0.10"
sha1 = "0.10"
tempfile = "3.13"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
walkdir = "2"
wit-component = "0.258"
wit-parser = "0.258"
zip = { version = "8", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
