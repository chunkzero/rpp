# Standalone crate: NOT a member of the rpp workspace. The empty [workspace]
# table below detaches it from any ancestor workspace so it can target
# wasm32-wasip2 independently.
[package]
name = "grayscale-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Example rpp WASM plugin: converts **/*.gray.png textures to grayscale"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.46"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
# Keep the component small and quick to build.
opt-level = "s"
strip = true
