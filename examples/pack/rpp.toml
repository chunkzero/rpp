[pack]
name = "rpp-example-pack"
description = "A tiny but complete Minecraft resource pack, built end-to-end by rpp."
pack_format = 34

[build]
source = "src"
output = "dist"
workers = 0 # 0 = use all available cores

[build.lua]
memory_limit_mb = 64
execution_deadline_seconds = 5

[build.squash]
enabled = true
engine = "builtin"
json = true # minify .json/.mcmeta in the output
png = "fast" # oxipng "fast" preset
zip = true # also write dist/rpp-example-pack.zip

# --- Plugins ---------------------------------------------------------------
# Ordered list. Order is the tie-break for processors that share a priority.
# These point at the sibling example plugin packages.

# 1. Compact every JSON / .mcmeta file.
[[plugin]]
source = "path:../plugins/json-minify"
[plugin.options]
pretty = false

# 2. Validate pack.mcmeta and texture animation metadata; fail the build on
#    anything malformed or a pack_format mismatch.
[[plugin]]
source = "path:../plugins/mcmeta-validate"

# 3. Fingerprint author-owned custom/ textures by content hash and emit
#    rename_map.json. Scoped so vanilla texture references stay intact.
[[plugin]]
source = "path:../plugins/hash-rename"
[plugin.options]
files = ["assets/*/textures/custom/**/*.png"]

# 4. Resolve renamed model textures and compile Lua item definitions into
#    models, translations, and a catalog for tools outside the resource pack.
[[plugin]]
source = "path:plugins/catalog"
[plugin.options]
namespace = "rpp"
[plugin.outputs]
catalog = "generated/catalog"
