[package]
name = "rpp-wasm"
description = "WASIp2 component plugin host for rpp, built on wasmtime"

version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
wasmtime = { version = "=41.0.0", features = ["cache", "component-model", "cranelift", "runtime"] }
wasmtime-wasi = "=41.0.0"
thiserror = "2"
libc = "0.2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.13"
