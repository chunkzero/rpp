[package]
name = "rpp-fetch"
description = "Plugin source resolution, caching, lockfile, and GitHub discovery for rpp"

version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
flate2 = "1"
tar = "0.4"
dirs = "5"

[dev-dependencies]
tempfile = "3"
