[package]
name = "rpp-cli"
description = "The CLI for rpp"

version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "rpp"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.37", features = ["derive"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tokio = { version = "1.44.2", features = ["full"] }
anyhow = "1.0.98"
async-stream = "0.3.6"
futures-util = "0.3.31"
http = "1.3.1"
tokio-stream = { version = "0.1.17", features = ["full"] }
viz = { version = "0.10.0", features = ["default", "sse"] }
mime = "0.3.17"
rpp = { path = "../rpp" }
serde = { version = "1.0.219", features = ["derive"] }
console = "0.16.1"
dialoguer = "0.12.0"
indicatif = { version = "0.18.2", features = ["tokio"] }
regex = "1.12.2"
once_cell = "1.21.3"
askama = "0.14.0"
toml_edit = "0.23.7"
toml = "0.9.8"
pathdiff = "0.2.3"
