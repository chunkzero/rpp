[package]
name = "rpp-cli"
description = "The CLI for rpp"

version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "rpp"
path = "src/main.rs"

[dependencies]
rpp = { path = "../rpp", features = ["wasm", "tracing"] }
rpp-fetch = { path = "../rpp-fetch" }
rpp-squash = { path = "../rpp-squash" }
rpp-wasm = { path = "../rpp-wasm" }

anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
toml = "0.9"
toml_edit = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

console = "0.15"
indicatif = "0.17"
dialoguer = "0.11"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "fs", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["fs"] }
notify = "6"
notify-debouncer-full = "0.3"
open = "5"
tempfile = "3.13"

[dev-dependencies]
zip = "8.6"
