[package]
name = "rpp"
description = "Core library for the rpp Minecraft resource pack build tool"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
tempfile.workspace = true
twox-hash = { version = "2.1.2", default-features = false, features = ["std", "xxhash3_64"] }
parking_lot = "0.12.5"
crossbeam-channel = "0.5.15"

ignore = "0.4.25"
regex = "1.12.2"
glob = "0.3"

bincode = { version = "2.0.1", features = ["serde"] }
semver.workspace = true
md5 = "0.7"
crc32fast = "1.4"

tracing = { workspace = true, optional = true }
mlua = { version = "0.11", features = ["lua54", "vendored", "serde", "send"], optional = true }
rpp-wasm = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[features]
default = ["lua"]
tracing = ["dep:tracing"]
lua = ["dep:mlua"]
wasm = ["dep:rpp-wasm"]

[[test]]
name = "engine_build"
required-features = ["lua"]

[[test]]
name = "example_plugins"
required-features = ["lua"]

[[test]]
name = "lua_processor"
required-features = ["lua"]

[[test]]
name = "lua_sandbox"
required-features = ["lua"]

[lints]
workspace = true
