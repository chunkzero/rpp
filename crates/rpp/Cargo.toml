[package]
name = "rpp"
description = "Core library for the rpp Minecraft resource pack build tool"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
tempfile.workspace = true
twox-hash = { version = "2.1.2", default-features = false, features = ["std", "xxhash3_64"] }
parking_lot = "0.12.5"
crossbeam-channel = "0.5.15"

ignore = "0.4.25"
glob = "0.3"

bincode = { version = "2.0.1", features = ["serde"] }
semver.workspace = true

tracing = { workspace = true, optional = true }
rpp-wasm = { workspace = true, optional = true }
rpp-js = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
md5 = { version = "0.7", optional = true }
crc32fast = { version = "1.4", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", optional = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[features]
default = []
tracing = ["dep:tracing"]
wasm = ["js", "dep:rpp-wasm"]
js = [
  "dep:rpp-js",
  "dep:toml",
  "dep:sha2",
  "dep:md5",
  "dep:crc32fast",
  "dep:libc",
  "dep:windows-sys",
]

[lints]
workspace = true
