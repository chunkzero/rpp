[package]
name = "rpp"
description = "Core library for the rpp Minecraft resource pack build tool"

version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
tempfile.workspace = true
twox-hash = { version = "2.1.2", default-features = false, features = ["std", "xxhash3_64"] }
parking_lot = "0.12.5"
crossbeam-channel = "0.5.15"

ignore = "0.4.25"
regex = "1.12.2"
glob = "0.3"

bincode = { version = "2.0.1", features = ["serde"] }
semver = "1.0"
md5 = "0.7"
crc32fast = "1.4"

tracing = { workspace = true, optional = true }
mlua = { version = "0.11", features = ["lua54", "vendored", "serde", "send"], optional = true }
rpp-wasm = { workspace = true, optional = true }

[features]
default = ["lua"]
tracing = ["dep:tracing"]
lua = ["dep:mlua"]
wasm = ["dep:rpp-wasm"]
