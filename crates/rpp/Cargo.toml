[package]
name = "rpp"

version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
once_cell = "1.21.3"
thiserror = "2.0.17"
serde = { version = "1.0.219", features = ["derive"] }
twox-hash = { version = "2.1.2", default-features = false, features = ["std", "xxhash3_64"] }
parking_lot = "0.12.5"
crossbeam-channel = "0.5.15"

ignore = "0.4.25"
regex = "1.12.2"

serde_json = { version = "1.0.140" }
jsonc-parser = { version = "0.27.0", features = ["serde"] }
toml = "0.9.8"
bincode = "2.0.1"

tracing = { version = "0.1", optional = true }
mlua = { version = "0.11.3", features = ["vendored", "luajit52", "serde"], optional = true }
include_directory = { version = "0.1.1", optional = true }
notify = { version = "8.2.0", optional = true }

[features]
default = ["lua", "watcher"]
watcher = ["dep:notify"]
tracing = ["dep:tracing"]
lua = ["dep:mlua", "dep:include_directory"]
