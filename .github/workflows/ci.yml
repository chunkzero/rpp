name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test binaries embed V8; full debug info exhausts runner disk space.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  formatting:
    name: Repository formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          version: 2026.9.1
      - run: mise exec -- just fmt-check

  verify:
    name: Rust lint, features, and tests (including WASM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v6
      - name: Fetch prebuilt V8
        # A restored target cache can keep the v8 build script's fingerprint but not its archive.
        run: |
          version=$(grep -A1 '^name = "v8"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          curl -sSfL "https://github.com/denoland/rusty_v8/releases/download/v$version/librusty_v8_release_x86_64-unknown-linux-gnu.a.gz" \
            | gunzip > "$RUNNER_TEMP/librusty_v8.a"
          echo "RUSTY_V8_ARCHIVE=$RUNNER_TEMP/librusty_v8.a" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@v3
        with:
          version: 2026.9.1
      - uses: Swatinem/rust-cache@v2
      - run: mise exec -- just verify-rust

  jvm:
    name: JVM client, real dev-server integration, and Minestom example
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v6
      - name: Fetch prebuilt V8
        # A restored target cache can keep the v8 build script's fingerprint but not its archive.
        run: |
          version=$(grep -A1 '^name = "v8"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          curl -sSfL "https://github.com/denoland/rusty_v8/releases/download/v$version/librusty_v8_release_x86_64-unknown-linux-gnu.a.gz" \
            | gunzip > "$RUNNER_TEMP/librusty_v8.a"
          echo "RUSTY_V8_ARCHIVE=$RUNNER_TEMP/librusty_v8.a" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@v3
        with:
          version: 2026.9.1
      - uses: Swatinem/rust-cache@v2
      - run: mise exec -- just verify-jvm

  windows:
    name: Windows core check and process tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked -p rpp --all-targets -- -D warnings
      - run: cargo test --locked -p rpp --lib host::process
