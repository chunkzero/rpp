name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Repository formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          version: 2026.9.1
      - run: mise exec -- just fmt-check

  verify:
    name: Rust lint, features, and tests (including WASM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          version: 2026.9.1
      - uses: kunobi-ninja/kache-action@cc1c9a8b07879bb477f580397d14ee669da26899 # v1
        with:
          version: 0.26.3
          cache-dir: ${{ runner.temp }}/kache
          cache-key-prefix: kache-${{ github.job }}
          max-size: 2GiB
          cache-executables: true
          pr-comment: false
      - run: mise exec -- just verify-rust

  jvm:
    name: JVM client, real dev-server integration, and Minestom example
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          version: 2026.9.1
      - uses: kunobi-ninja/kache-action@cc1c9a8b07879bb477f580397d14ee669da26899 # v1
        with:
          version: 0.26.3
          cache-dir: ${{ runner.temp }}/kache
          cache-key-prefix: kache-${{ github.job }}
          max-size: 2GiB
          cache-executables: true
          pr-comment: false
      - run: mise exec -- just verify-jvm

  windows:
    name: Windows core check and process tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: kunobi-ninja/kache-action@cc1c9a8b07879bb477f580397d14ee669da26899 # v1
        with:
          version: 0.26.3
          cache-dir: ${{ runner.temp }}/kache
          cache-key-prefix: kache-${{ github.job }}
          max-size: 2GiB
          pr-comment: false
      - run: cargo clippy --locked -p rpp --all-targets -- -D warnings
      - run: cargo test --locked -p rpp --lib lua::process
