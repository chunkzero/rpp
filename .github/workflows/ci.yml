name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, features, and tests (including WASM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          version: 2026.9.1
      - uses: Swatinem/rust-cache@v2
      - run: mise exec -- just ci

  jvm:
    name: JVM client, real dev-server integration, and Minestom example
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          version: 2026.9.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            25
            21
      - run: mise exec -- cargo build --locked -p rpp-cli
      - run: integrations/jvm/gradlew -p integrations/jvm :test :examples:minestom:classes --no-daemon
        env:
          RPP_BIN: ${{ github.workspace }}/target/debug/rpp

  windows:
    name: Windows core check and process tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked -p rpp --all-targets -- -D warnings
      - run: cargo test --locked -p rpp --lib lua::process
