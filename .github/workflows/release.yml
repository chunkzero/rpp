name: Release binaries

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package.sh
      - scripts/release.py
      - scripts/test_release.py
      - scripts/install.sh
      - scripts/fixtures/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
  schedule:
    - cron: "17 4 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: Release channel
        type: choice
        options: [nightly, release]
        default: nightly
      publish:
        description: Publish this rpp version to GitHub Releases
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s scripts -p test_release.py
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.mode || 'release' }}
        run: python3 scripts/release.py plan

  package:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RPP_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    outputs:
      version: ${{ needs.plan.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          version: 2026.9.1
      - uses: Swatinem/rust-cache@v2
      - name: Rerun the V8 build script
        # rust-cache keeps the v8 build-script fingerprint but deletes the archive it downloaded.
        run: rm -rf target/release/.fingerprint/v8-* target/release/build/v8-*
      - run: mise exec -- cargo build --release --locked -p rpp-cli
      - run: mise exec -- scripts/package.sh --output dist
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: rpp-linux-x64
          path: |
            dist/*.tar.gz
            dist/*.sha256
            scripts/install.sh
          if-no-files-found: error
          # Cleanup deletes it once used; retention only bounds runs that never reach cleanup.
          retention-days: 1

  verify:
    needs: package
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 20
    steps:
      - name: Install consumer prerequisites
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/fixtures
      - uses: actions/download-artifact@v4
        with:
          name: rpp-linux-x64
          path: artifact
      - name: Install and run without a Rust toolchain or tsc
        env:
          RPP_VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -eu
          export RPP_INSTALL_DIR="$RUNNER_TEMP/prefix"
          archive="artifact/dist/rpp-$RPP_VERSION-linux-x64.tar.gz"
          sh artifact/scripts/install.sh "$RPP_VERSION" "$archive"
          export PATH="$RPP_INSTALL_DIR/bin:$PATH"
          if command -v tsc cargo rustc node; then exit 1; fi
          test "$(rpp --version)" = "rpp $RPP_VERSION"
          cd scripts/fixtures/check-plugin
          rpp check
      - name: Reject a corrupted checksum
        env:
          RPP_VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -eu
          cp -r artifact/dist corrupted
          archive="corrupted/rpp-$RPP_VERSION-linux-x64.tar.gz"
          printf '%064d  %s\n' 0 "$(basename "$archive")" > "$archive.sha256"
          if RPP_INSTALL_DIR="$RUNNER_TEMP/rejected" sh artifact/scripts/install.sh "$RPP_VERSION" "$archive"; then
            echo "install.sh accepted a corrupted checksum" >&2
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/rejected/bin/rpp"

  publish:
    if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [package, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: rpp-linux-x64
          path: artifact
      - name: Publish verified draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          cp artifact/scripts/install.sh artifact/dist/
          (cd artifact/dist && sha256sum install.sh > install.sh.sha256)
          python3 scripts/release.py publish --directory artifact/dist
      - uses: aquaproj/aqua-installer@v4.0.5
        with:
          aqua_version: v2.63.0
          skip_install_aqua: false
          enable_aqua_install: "false"
      - name: Verify registry installation and bundled compiler
        env:
          AQUA_GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/aqua-consumer"
          cd "$RUNNER_TEMP/aqua-consumer"
          cat > aqua.yaml <<EOF
          checksum:
            enabled: true
            require_checksum: true
          registries:
            - name: chunkzero
              type: github_content
              repo_owner: chunkzero
              repo_name: aqua-registry
              ref: 377cfe0fcd1a42625c428a00bf209b7544e92297
              path: registry.yaml
          packages:
            - name: chunkzero/rpp@v$RELEASE_VERSION
              registry: chunkzero
          EOF
          cp "$GITHUB_WORKSPACE/scripts/aqua-policy.yaml" .
          export AQUA_POLICY_CONFIG="$PWD/aqua-policy.yaml"
          aqua policy allow "$AQUA_POLICY_CONFIG"
          aqua update-checksum
          aqua install
          test "$(aqua exec -- rpp --version)" = "rpp $RELEASE_VERSION"
          cd "$GITHUB_WORKSPACE/scripts/fixtures/check-plugin"
          aqua -c "$RUNNER_TEMP/aqua-consumer/aqua.yaml" exec -- rpp check

  # The artifact only hands the archive between jobs; keeping it counts against Actions storage.
  cleanup:
    if: >-
      always() && needs.package.outputs.artifact-id != '' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    needs: [package, verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete the release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.package.outputs.artifact-id }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
