name: Release binaries

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package.sh
      - scripts/install.sh
      - scripts/fixtures/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this rpp version to GitHub Releases
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.value }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          version: 2026.9.1
      - name: Read workspace version
        id: version
        run: echo "value=$(mise exec -- cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "rpp-cli") | .version')" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
      - name: Rerun the V8 build script
        # rust-cache keeps the v8 build-script fingerprint but deletes the archive it downloaded.
        run: rm -rf target/release/.fingerprint/v8-* target/release/build/v8-*
      - run: mise exec -- cargo build --release --locked -p rpp-cli
      - run: mise exec -- scripts/package.sh --output dist
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: rpp-linux-x64
          path: |
            dist/*.tar.gz
            dist/*.sha256
            scripts/install.sh
          if-no-files-found: error
          # Cleanup deletes it once used; retention only bounds runs that never reach cleanup.
          retention-days: 1

  verify:
    needs: package
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 20
    steps:
      - name: Install consumer prerequisites
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/fixtures
      - uses: actions/download-artifact@v4
        with:
          name: rpp-linux-x64
          path: artifact
      - name: Install and run without a Rust toolchain or tsc
        env:
          RPP_VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -eu
          export RPP_INSTALL_DIR="$RUNNER_TEMP/prefix"
          archive="artifact/dist/rpp-$RPP_VERSION-linux-x64.tar.gz"
          sh artifact/scripts/install.sh "$RPP_VERSION" "$archive"
          export PATH="$RPP_INSTALL_DIR/bin:$PATH"
          if command -v tsc cargo rustc node; then exit 1; fi
          test "$(rpp --version)" = "rpp $RPP_VERSION"
          cd scripts/fixtures/check-plugin
          rpp check
      - name: Reject a corrupted checksum
        env:
          RPP_VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -eu
          cp -r artifact/dist corrupted
          archive="corrupted/rpp-$RPP_VERSION-linux-x64.tar.gz"
          printf '%064d  %s\n' 0 "$(basename "$archive")" > "$archive.sha256"
          if RPP_INSTALL_DIR="$RUNNER_TEMP/rejected" sh artifact/scripts/install.sh "$RPP_VERSION" "$archive"; then
            echo "install.sh accepted a corrupted checksum" >&2
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/rejected/bin/rpp"

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [package, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: rpp-linux-x64
          path: artifact
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RPP_VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -eu
          name="rpp-$RPP_VERSION-linux-x64"
          archive="artifact/dist/$name.tar.gz"
          (cd artifact/dist && sha256sum --check "$name.tar.gz.sha256")
          git fetch --tags --quiet origin
          tag_commit=$(git rev-parse --verify --quiet "refs/tags/v$RPP_VERSION^{commit}" || true)
          if [ -n "$tag_commit" ]; then test "$tag_commit" = "$GITHUB_SHA"; fi
          if gh release view "v$RPP_VERSION" --json isDraft,targetCommitish > release-state.json; then
            test "$(jq -r '.isDraft' release-state.json)" = true
            test "$(jq -r '.targetCommitish' release-state.json)" = "$GITHUB_SHA"
          else
            gh release create "v$RPP_VERSION" --draft --target "$GITHUB_SHA" --title "rpp $RPP_VERSION" --generate-notes
          fi
          gh release upload "v$RPP_VERSION" "$archive" "$archive.sha256" artifact/scripts/install.sh --clobber
          case "$RPP_VERSION" in
            *-*) gh release edit "v$RPP_VERSION" --draft=false --prerelease --latest=false ;;
            *) gh release edit "v$RPP_VERSION" --draft=false --prerelease=false --latest ;;
          esac

  # The artifact only hands the archive between jobs; keeping it counts against Actions storage.
  cleanup:
    if: always() && needs.package.outputs.artifact-id != ''
    needs: [package, verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete the release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.package.outputs.artifact-id }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
